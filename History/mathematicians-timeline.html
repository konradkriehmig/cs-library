<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathematicians</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1410;
    --paper: #f5efe3;
    --aged: #c8b89a;
    --rust: #8b3a2a;
    --gold: #b8922a;
    --line: #c8b89a;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IM Fell English', serif;
    min-height: 100vh;
    padding: 60px 40px;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(180,160,120,0.15) 27px, rgba(180,160,120,0.15) 28px),
      radial-gradient(ellipse at 20% 50%, rgba(200,180,140,0.3) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(180,150,100,0.2) 0%, transparent 50%);
  }

  header {
    text-align: center;
    margin-bottom: 70px;
    animation: fadeIn 1s ease;
  }

  header h1 {
    font-family: 'IM Fell English SC', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    letter-spacing: 0.08em;
    color: var(--ink);
    position: relative;
    display: inline-block;
  }

  header h1::after {
    content: '';
    display: block;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--rust), var(--gold), var(--rust), transparent);
    margin-top: 12px;
    animation: expand 1.2s ease forwards;
    transform-origin: center;
  }

  header p {
    font-style: italic;
    color: var(--gold);
    margin-top: 10px;
    font-size: 1rem;
    letter-spacing: 0.05em;
  }

  .timeline {
    position: relative;
    max-width: 900px;
    margin: 0 auto;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 1px;
    background: linear-gradient(180deg, transparent, var(--aged) 5%, var(--aged) 95%, transparent);
    transform: translateX(-50%);
  }

  .entry {
    display: flex;
    align-items: flex-start;
    gap: 40px;
    margin-bottom: 52px;
    opacity: 0;
    animation: slideIn 0.6s ease forwards;
    position: relative;
  }

  .entry:nth-child(odd) { flex-direction: row; }
  .entry:nth-child(even) { flex-direction: row-reverse; }

  .entry:nth-child(1)  { animation-delay: 0.1s; }
  .entry:nth-child(2)  { animation-delay: 0.2s; }
  .entry:nth-child(3)  { animation-delay: 0.3s; }
  .entry:nth-child(4)  { animation-delay: 0.4s; }
  .entry:nth-child(5)  { animation-delay: 0.5s; }
  .entry:nth-child(6)  { animation-delay: 0.6s; }
  .entry:nth-child(7)  { animation-delay: 0.7s; }
  .entry:nth-child(8)  { animation-delay: 0.8s; }
  .entry:nth-child(9)  { animation-delay: 0.9s; }
  .entry:nth-child(10) { animation-delay: 1.0s; }
  .entry:nth-child(11) { animation-delay: 1.1s; }
  .entry:nth-child(12) { animation-delay: 1.2s; }
  .entry:nth-child(13) { animation-delay: 1.3s; }
  .entry:nth-child(14) { animation-delay: 1.4s; }
  .entry:nth-child(15) { animation-delay: 1.5s; }

  .card {
    flex: 1;
    background: rgba(245, 239, 227, 0.8);
    border: 1px solid var(--aged);
    padding: 18px 22px;
    position: relative;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    cursor: default;
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 4px 6px 20px rgba(100,70,30,0.15);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 3px; left: 3px; right: -3px; bottom: -3px;
    border: 1px solid var(--aged);
    opacity: 0.4;
    z-index: -1;
  }

  .entry:nth-child(odd) .card::after {
    content: '';
    position: absolute;
    right: -21px;
    top: 20px;
    width: 0; height: 0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-left: 8px solid var(--aged);
  }

  .entry:nth-child(even) .card::after {
    content: '';
    position: absolute;
    left: -21px;
    top: 20px;
    width: 0; height: 0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-right: 8px solid var(--aged);
  }

  .name {
    font-family: 'IM Fell English SC', serif;
    font-size: 1.15rem;
    color: var(--rust);
    letter-spacing: 0.04em;
  }

  .dates {
    font-size: 0.78rem;
    color: var(--gold);
    margin: 3px 0 8px;
    font-style: italic;
    letter-spacing: 0.03em;
  }

  .origin {
    font-size: 0.82rem;
    color: #6b5a44;
    margin-bottom: 6px;
  }

  .tag {
    display: inline-block;
    font-family: 'IM Fell English SC', serif;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    color: var(--paper);
    background: var(--rust);
    padding: 2px 9px;
    margin-top: 4px;
  }

  .node {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 11px;
    height: 11px;
    background: var(--gold);
    border: 2px solid var(--rust);
    border-radius: 50%;
    top: 22px;
    z-index: 2;
    transition: transform 0.2s;
  }

  .entry:hover .node {
    transform: translateX(-50%) scale(1.4);
  }

  .spacer { flex: 1; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes expand {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }

  @media (max-width: 640px) {
    .timeline::before { left: 16px; }
    .entry, .entry:nth-child(even) { flex-direction: column; padding-left: 40px; }
    .node { left: 16px; }
    .entry:nth-child(odd) .card::after,
    .entry:nth-child(even) .card::after { display: none; }
    .spacer { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>A Chronicle of Mathematicians</h1>
  <p>from antiquity to modernity</p>
</header>

<div class="timeline" id="timeline"></div>

<script>
const data = [
  { name: "Euclid",          dates: "c. 300 BC",       origin: "Alexandria, Egypt",    tag: "Geometry"       },
  { name: "Archimedes",      dates: "c. 287–212 BC",   origin: "Syracuse, Sicily",     tag: "Calculus"       },
  { name: "Pingala",         dates: "c. 200 BC",       origin: "India",                tag: "Combinatorics"  },
  { name: "Al-Khwarizmi",    dates: "c. 780–850",      origin: "Khwarazm, Persia",     tag: "Algebra"        },
  { name: "Yang Hui",        dates: "c. 1238–1298",    origin: "Qiantang, China",      tag: "Pascal's Triangle" },
  { name: "Fibonacci",       dates: "c. 1170–1250",    origin: "Pisa, Italy",          tag: "Sequences"      },
  { name: "Cardano",         dates: "1501–1576",       origin: "Pavia, Italy",         tag: "Probability"    },
  { name: "Fermat",          dates: "1601–1665",       origin: "Beaumont, France",     tag: "Number Theory"  },
  { name: "Pascal",          dates: "1623–1662",       origin: "Clermont, France",     tag: "Combinatorics"  },
  { name: "Leibniz",         dates: "1646–1716",       origin: "Leipzig, Germany",     tag: "Calculus"       },
  { name: "Newton",          dates: "1643–1727",       origin: "Lincolnshire, England",tag: "Calculus"       },
  { name: "Euler",           dates: "1707–1783",       origin: "Basel, Switzerland",   tag: "Everything"     },
  { name: "Gauss",           dates: "1777–1855",       origin: "Brunswick, Germany",   tag: "Statistics"     },
  { name: "Riemann",         dates: "1826–1866",       origin: "Breselenz, Germany",   tag: "Analysis"       },
  { name: "Poincaré",        dates: "1854–1912",       origin: "Nancy, France",        tag: "Topology"       },
  { name: "Ramanujan",       dates: "1887–1920",       origin: "Erode, India",         tag: "Series"         },
  { name: "Kolmogorov",      dates: "1903–1987",       origin: "Tambov, Russia",       tag: "Probability"    },
  { name: "Turing",          dates: "1912–1954",       origin: "London, England",      tag: "Computation"    },
];

const tl = document.getElementById('timeline');

data.forEach((m, i) => {
  const entry = document.createElement('div');
  entry.className = 'entry';

  const card = `
    <div class="card">
      <div class="name">${m.name}</div>
      <div class="dates">${m.dates}</div>
      <div class="origin">⌖ ${m.origin}</div>
      <span class="tag">${m.tag}</span>
    </div>
  `;

  entry.innerHTML = i % 2 === 0
    ? `${card}<div class="node"></div><div class="spacer"></div>`
    : `<div class="spacer"></div><div class="node"></div>${card}`;

  tl.appendChild(entry);
});
</script>

</body>
</html>
